[build.environment]
  NODE_VERSION = "22"
[functions]
included_files = [
  "node_modules/next/dist/server/future/route-modules/pages/vendored/contexts/router-context*",
  "node_modules/next/dist/server/future/route-modules/pages/vendored/contexts/amp-context*",
  "node_modules/next/dist/server/future/route-modules/pages/vendored/contexts/head-manager-context*",
  "node_modules/next/dist/server/future/route-modules/pages/vendored/contexts/html-context*",
]
[[redirects]]
  from = "/unsplash/:dims/*"
  to = "https://ct26be.codetribe.ai/unsplash/image?width=:dims&height=:dims&query=:splat"
  status = 200
  force = true
[[redirects]]
  from = "/unsplash/:dims"
  to = "https://ct26be.codetribe.ai/unsplash/image?width=:dims&height=:dims"
  status = 200
  force = true
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/lang/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"